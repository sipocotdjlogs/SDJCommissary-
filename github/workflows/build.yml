name: Build SDJ Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Unzip Android Studio Project
        run: |
          unzip -q SDJ_PDL_Cash_Canteen_Android_Studio_Project.zip -d extracted_project

      - name: Build Debug APK with Gradle
        run: |
          cd extracted_project/*
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: SDJ-PDL-Cash-Canteen-debug-apk
          path: extracted_project/*/app/build/outputs/apk/debug/app-debug.apk
