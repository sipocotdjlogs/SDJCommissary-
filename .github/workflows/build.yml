name: Build SDJ Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Extract and Locate Project
        run: |
          mkdir -p extracted_project
          unzip -q SDJ_PDL_Cash_Canteen_Android_Studio_Project.zip -d extracted_project
          
          # Pumunta muna sa extracted folder
          cd extracted_project
          
          # Kung may subfolder na nalikha sa loob, pumasok dito kung naglalaman ng build.gradle o gradlew
          if [ -d "SDJ_PDL_Cash_Canteen_Android_Studio_Project" ]; then
            cd SDJ_PDL_Cash_Canteen_Android_Studio_Project
          elif [ -d "SDJ_PDL_Cash_Canteen" ]; then
            cd SDJ_PDL_Cash_Canteen
          else
            # Kung walang saktong pangalan, hanapin ang unang folder na may gradlew o build.gradle
            SUBDIR=$(find . -maxdepth 2 -name "build.gradle" -o -name "gradlew" | head -n 1 | xargs dirname 2>/dev/null || echo ".")
            cd "$SUBDIR"
          fi
          
          echo "Current working directory: $(pwd)"
          
          if [ ! -f "gradlew" ]; then
            echo "Generating Gradle wrapper..."
            gradle wrapper
          fi
          
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SDJ-PDL-Cash-Canteen-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
