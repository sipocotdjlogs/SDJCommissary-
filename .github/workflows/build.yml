
name: Build SDJ Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Extract Android Project
      
      - name: Fix and Validate Android Manifest
        shell: bash
        run: |
          set -e

          MANIFEST="extracted_project/SDJAndroid/app/src/main/AndroidManifest.xml"

          python3 -c '
          from pathlib import Path
          import xml.etree.ElementTree as ET

          p = Path("extracted_project/SDJAndroid/app/src/main/AndroidManifest.xml")
          content = p.read_text(encoding="utf-8")
          content = content.replace("SDJ Cash & Canteen", "SDJ Cash &amp; Canteen")
          p.write_text(content, encoding="utf-8")

          ET.parse(p)
          print("AndroidManifest.xml is valid!")
          '

          echo "Manifest validation successful."
          
        shell: bash
        run: |
          set -e

          ZIP_FILE="SDJ_PDL_Cash_Canteen_Android_Studio_Project.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Android project ZIP not found!"
            exit 1
          fi

          mkdir -p extracted_project

          unzip -oq "$ZIP_FILE" -d extracted_project

          echo "PROJECT EXTRACTED SUCCESSFULLY"

          find extracted_project -maxdepth 3 -type f

      - name: Locate Android Project
        shell: bash
        run: |
          set -e

          PROJECT_FILE=$(find extracted_project -type f \
            -name "settings.gradle.kts" -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            PROJECT_FILE=$(find extracted_project -type f \
              -name "settings.gradle" -print -quit)
          fi

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: Gradle settings file not found!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "ANDROID PROJECT: $PROJECT_DIR"

      - name: Build SDJ Android APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Building SDJ PDL Cash Canteen..."

          gradle --version

          gradle --no-daemon assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SDJ-PDL-Cash-Canteen-debug-apk
          path: extracted_project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
