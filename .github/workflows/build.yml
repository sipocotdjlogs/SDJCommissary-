
name: Build SDJ Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android Studio Project
        shell: bash
        run: |
          set -e

          ZIP_FILE="SDJ_PDL_Cash_Canteen_Android_Studio_Project.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP file not found!"
            ls -lah
            exit 1
          fi

          mkdir -p extracted_project

          unzip -q "$ZIP_FILE" -d extracted_project

          echo "Searching for Gradle project files..."

          PROJECT_FILE=$(find extracted_project -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            PROJECT_FILE=$(find extracted_project -type f \
              \( -name "build.gradle" -o -name "build.gradle.kts" \) \
              -print -quit)
          fi

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: No Gradle build files found!"
            echo "Extracted files:"
            find extracted_project -maxdepth 4 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          echo "Found project at: $PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build Android APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          if [ ! -f "gradlew" ]; then
            echo "ERROR: Gradle wrapper (gradlew) not found!"
            echo "Please include the Gradle wrapper in your Android Studio project ZIP."
            exit 1
          fi

          chmod +x gradlew

          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SDJ-PDL-Cash-Canteen-debug-apk
          path: extracted_project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
