name: Build SDJ Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Extract and Build APK
        run: |
          mkdir -p extracted_project
          unzip -q SDJ_PDL_Cash_Canteen_Android_Studio_Project.zip -d extracted_project
          
          # Hanapin kung saang subfolder naroon ang settings.gradle o build.gradle
          PROJECT_DIR=$(find extracted_project -name "settings.gradle" -o -name "build.gradle" | head -n 1 | xargs dirname)
          
          if [ -z "$PROJECT_DIR" ]; then
            echo "Error: Gradle build files not found!"
            exit 1
          fi
          
          echo "Found project directory at: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          # Kung walang gradlew, gumawa ng wrapper
          if [ ! -f "gradlew" ]; then
            echo "Generating Gradle wrapper..."
            gradle wrapper
          fi
          
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SDJ-PDL-Cash-Canteen-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
