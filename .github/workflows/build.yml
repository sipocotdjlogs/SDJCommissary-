
name: Build SDJ Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build SDJ Cash and Canteen
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Install Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Install Gradle 8.9
      - name: Install Gradle 8.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"

      # 4. Extract Android Studio Project
      - name: Extract Android Project
        shell: bash
        run: |
          set -e

          ZIP_FILE="SDJ_PDL_Cash_Canteen_Android_Studio_Project.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Android project ZIP not found!"
            ls -lah
            exit 1
          fi

          mkdir -p extracted_project

          unzip -oq "$ZIP_FILE" -d extracted_project

          echo "PROJECT EXTRACTED SUCCESSFULLY"

          find extracted_project -maxdepth 4 -type f

      # 5. Locate Android Project
      - name: Locate Android Project
        shell: bash
        run: |
          set -e

          PROJECT_FILE=$(find extracted_project -type f \
            -name "settings.gradle.kts" -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            PROJECT_FILE=$(find extracted_project -type f \
              -name "settings.gradle" -print -quit)
          fi

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: Gradle settings file not found!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "ANDROID PROJECT: $PROJECT_DIR"

      # 6. Automatically Fix Android Manifest
      - name: Fix Android Manifest
        shell: bash
        run: |
          set -e

          MANIFEST="$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "ERROR: AndroidManifest.xml not found!"
            exit 1
          fi

          python3 - "$MANIFEST" <<'PY'
          import sys
          from pathlib import Path
          import xml.etree.ElementTree as ET

          manifest = Path(sys.argv[1])

          content = manifest.read_text(encoding="utf-8")

          content = content.replace(
              "SDJ Cash & Canteen",
              "SDJ Cash &amp; Canteen"
          )

          manifest.write_text(content, encoding="utf-8")

          ET.parse(manifest)

          print("AndroidManifest.xml is valid!")
          PY

      # 7. Build Android APK
      - name: Build SDJ Android APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Starting SDJ Android APK Build..."

          gradle --version

          gradle --no-daemon assembleDebug --stacktrace

          echo "APK BUILD COMPLETED!"

      # 8. Verify APK
      - name: Verify APK
        shell: bash
        run: |
          set -e

          find "$PROJECT_DIR" -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print

          APK_COUNT=$(find "$PROJECT_DIR" -type f \
            -path "*/build/outputs/apk/debug/*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: APK file was not generated!"
            exit 1
          fi

          echo "APK FILE SUCCESSFULLY GENERATED!"

      # 9. Upload APK
      - name: Upload SDJ Android APK
        uses: actions/upload-artifact@v4
        with:
          name: SDJ-PDL-Cash-Canteen-debug-apk
          path: extracted_project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
