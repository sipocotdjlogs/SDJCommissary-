name: Build SDJ Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Extract Project
        run: |
          mkdir -p extracted_project
          unzip -q SDJ_PDL_Cash_Canteen_Android_Studio_Project.zip -d extracted_project

      - name: Build Debug APK with Gradle
        run: |
          cd extracted_project
          # Kung may subfolder sa loob ng ZIP, hanapin kung nasaan ang build.gradle o gradlew
          if [ -d "SDJ_PDL_Cash_Canteen_Android_Studio_Project" ]; then
            cd SDJ_PDL_Cash_Canteen_Android_Studio_Project
          elif [ -d "SDJ_PDL_Cash_Canteen" ]; then
            cd SDJ_PDL_Cash_Canteen
          fi

          if [ ! -f "gradlew" ]; then
            echo "Generating Gradle wrapper..."
            gradle wrapper
          fi

          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SDJ-PDL-Cash-Canteen-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
