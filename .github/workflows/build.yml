
name: Build SDJ Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build SDJ Cash and Canteen
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Extract Android Project
        shell: bash
        run: |
          set -e

          ZIP_FILE="SDJ_PDL_Cash_Canteen_Android_Studio_Project_ANDROID6_SCANNER_REPAIRED.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Android project ZIP not found!"
            exit 1
          fi

          mkdir -p extracted_project
          unzip -oq "$ZIP_FILE" -d extracted_project

          echo "PROJECT EXTRACTED SUCCESSFULLY"

      - name: Locate Android Project
        shell: bash
        run: |
          set -e

          PROJECT_FILE=$(find extracted_project -type f \
            -name "settings.gradle.kts" -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            PROJECT_FILE=$(find extracted_project -type f \
              -name "settings.gradle" -print -quit)
          fi

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: Gradle settings file not found!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "ANDROID PROJECT: $PROJECT_DIR"

      - name: Fix Android Manifest
        shell: bash
        run: |
          set -e

          MANIFEST="$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          python3 - "$MANIFEST" <<'PY'
          import sys
          from pathlib import Path
          import xml.etree.ElementTree as ET

          p = Path(sys.argv[1])
          content = p.read_text(encoding="utf-8")

          content = content.replace(
              "SDJ Cash & Canteen",
              "SDJ Cash &amp; Canteen"
          )

          p.write_text(content, encoding="utf-8")
          ET.parse(p)

          print("Manifest is valid!")
          PY

      - name: Fix Java and Kotlin JVM Targets
        shell: bash
        run: |
          set -e

          GRADLE_FILE="$PROJECT_DIR/app/build.gradle.kts"

          python3 - "$GRADLE_FILE" <<'PY'
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          content = p.read_text(encoding="utf-8")

          if "compileOptions" not in content:
              content = content.replace(
                  "android {",
                  """android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          """,
                  1
              )

          p.write_text(content, encoding="utf-8")

          print("Java target: 17")
          print("Kotlin target: 17")
          print("Gradle configuration updated!")
          PY

          cat "$GRADLE_FILE"

      - name: Build SDJ Android APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Building SDJ Cash and Canteen..."

          gradle --version

          gradle --no-daemon assembleDebug --stacktrace

          echo "APK BUILD COMPLETED!"

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK_COUNT=$(find "$PROJECT_DIR" -type f \
            -path "*/build/outputs/apk/debug/*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: APK was not generated!"
            exit 1
          fi

          find "$PROJECT_DIR" -type f \
            -path "*/build/outputs/apk/debug/*.apk"

          echo "APK VERIFIED SUCCESSFULLY!"

      - name: Upload SDJ Android APK
        uses: actions/upload-artifact@v4
        with:
          name: SDJ-PDL-Cash-Canteen-debug-apk
          path: extracted_project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
