name: Build SDJ Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Diagnose and Unzip Project
        run: |
          echo "Listing repository files:"
          ls -la
          
          ZIP_FILE="SDJ_PDL_Cash_Canteen_Android_Studio_Project.zip"
          if [ ! -f "$ZIP_FILE" ]; then
            echo "Error: $ZIP_FILE not found in root directory!"
            exit 1
          fi
          
          mkdir -p extracted_project
          unzip -q "$ZIP_FILE" -d extracted_project
          echo "Extracted contents:"
          ls -la extracted_project

      - name: Build Debug APK with Gradle
        run: |
          if [ -f "extracted_project/gradlew" ]; then
            cd extracted_project
          else
            SUBDIR=$(find extracted_project -maxdepth 2 -name "gradlew" -exec dirname {} \; | head -n 1)
            if [ -n "$SUBDIR" ]; then
              cd "$SUBDIR"
            else
              echo "No gradlew found, generating Gradle wrapper..."
              cd extracted_project/*
              gradle wrapper
            fi
          fi
          
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SDJ-PDL-Cash-Canteen-debug-apk
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
