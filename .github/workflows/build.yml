name: Build SDJ Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Extract and Locate Project
        run: |
          mkdir -p extracted_project
          unzip -q SDJ_PDL_Cash_Canteen_Android_Studio_Project.zip -d extracted_project
          
          # Awtomatikong hanapin ang folder kung nasaan ang build.gradle o gradlew
          PROJECT_PATH=$(find extracted_project -name "build.gradle" -o -name "gradlew" | head -n 1 | xargs dirname)
          if [ -z "$PROJECT_PATH" ]; then
            cd extracted_project/*
          else
            cd "$PROJECT_PATH"
          fi
          
          echo "Working directory: $(pwd)"
          
          if [ ! -f "gradlew" ]; then
            echo "Generating Gradle wrapper..."
            gradle wrapper
          fi
          
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SDJ-PDL-Cash-Canteen-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
